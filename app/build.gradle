plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.xiaofeng.androidlibs'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.xiaofeng.androidlibs'
        minSdk = MIN_SDK as int
        targetSdk = 37
        versionCode = VERSION_CODE as int
        versionName = VERSION_NAME
    }

    signingConfigs {
        release {
            def keystore = System.getenv('ANDROID_KEYSTORE_FILE')
            if (keystore) {
                storeFile = file(keystore)
                storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Unsigned when no keystore is provided (e.g. pull requests and forks).
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':flowlayoutmanager')
}
