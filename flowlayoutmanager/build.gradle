plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

group = 'com.github.simonebortolin'
version = VERSION_NAME

android {
    namespace = 'com.xiaofeng.flowlayoutmanager'
    compileSdk = 37

    defaultConfig {
        minSdk = MIN_SDK as int
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // FlowLayoutManager extends RecyclerView.LayoutManager, so RecyclerView is part of the public API.
    api libs.androidx.recyclerview

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'FlowLayoutManager'
            }
        }
    }
}
